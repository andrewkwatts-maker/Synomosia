[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "synomosia"
version = "1.1.0"
description = "Conspiracy theories, hidden histories, and suppressed knowledge"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Andrew Watts", email = "andrewkwatts@gmail.com"},
]
keywords = ["conspiracy", "history", "secret societies", "hidden knowledge", "alternative history"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "eyecore[feed]>=1.1.0",
]

[project.optional-dependencies]
bake = [
    "requests>=2.28",
]
scrape = [
    "feedparser>=6.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "praw>=7.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/andrewkwatts-maker/Synomosia"
Repository = "https://github.com/andrewkwatts-maker/Synomosia"
Issues = "https://github.com/andrewkwatts-maker/Synomosia/issues"

[tool.maturin]
manifest-path = "rust/augur_core/Cargo.toml"
python-source = "src"
module-name = "synomosia._core"
# `extension-module` implies `python` and additionally stops PyO3 linking
# libpython, which a wheel needs and a test binary cannot survive. Only the
# wheel build sets it; `cargo test --features python` links and runs normally.
features = ["extension-module"]
exclude = ["src/synomosia/_data/*.db.gz", "src/synomosia/_data/*.db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
